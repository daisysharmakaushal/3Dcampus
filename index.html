<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNDEC Smart Campus 3D</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif}
#map{position:absolute;inset:0}
#map.night canvas{filter:brightness(.55) saturate(1.3) contrast(1.1)}
#menu{position:absolute;top:10px;left:10px;z-index:3;width:44px;height:44px;border:0;border-radius:12px;background:#1a4fa0;color:#fff;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
.pclosed #panel{display:none}
@media(max-width:700px){#panel{width:calc(100vw - 20px)!important}#q{font-size:16px}.pin i{width:26px;height:26px;font-size:14px}.pin span{font-size:10px}.minor i{width:20px;height:20px;font-size:11px}.btn{padding:12px;font-size:14px}}
#panel{position:absolute;top:62px;left:10px;z-index:2;width:240px;max-height:calc(100% - 74px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.nu #panel{background:#1b2233;color:#e8ecf5}
#banner{height:110px;border-radius:14px 14px 0 0;background:#1a4fa0 center/cover;position:relative}
#banner b{position:absolute;left:10px;bottom:8px;color:#fff;font-size:16px;text-shadow:0 1px 4px #000}
#pb{padding:10px}
#q{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccd;border-radius:8px;margin-bottom:6px}
.btn{display:block;width:100%;text-align:left;border:0;background:#eef3fb;margin:4px 0;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
.nu .btn{background:#2a3450;color:#e8ecf5}
.btn:hover{filter:brightness(.93)}
.pri{background:#1a4fa0!important;color:#fff!important;text-align:center}
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin i{font-style:normal;font-size:18px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pin span{margin-top:2px;background:rgba(255,255,255,.92);color:#222;font-size:11px;padding:1px 6px;border-radius:8px;white-space:nowrap;font-weight:600}
.card{width:240px}.card img{width:100%;border-radius:8px;display:block}
.th{display:flex;gap:4px;margin-top:4px}.th img{width:48px!important;height:34px;object-fit:cover;cursor:pointer;border-radius:4px}
.minor i{width:24px;height:24px;font-size:13px;border-width:2px}
.nolbl .minor span{display:none}
.bn{background:rgba(26,79,160,.92);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px;white-space:nowrap;pointer-events:none}
.tag{display:inline-block;color:#fff;font-size:11px;padding:1px 8px;border-radius:8px}
#status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:8px 14px;border-radius:18px;max-width:90%;text-align:center}
.lowz .minor,.lowz .pin span{display:none}
</style></head><body>
<button id="menu" aria-label="Menu">✕</button>
<div id="panel">
  <div id="banner"><b>GNDEC Smart Campus</b></div>
  <div id="pb">
    <input id="q" placeholder="Search: Library, Hostel...">
    <div id="list"></div>
    <button class="btn pri" id="reset">Reset view</button>
    <button class="btn" id="night">Night mode</button>
    <button class="btn" id="copybn">Copy building names</button>
  </div>
</div>
<div id="map"></div>
<div id="status">Loading map...</div>

// ---- helpers ----
const inside=(pt,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];
  if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;};
const firstPt=g=>{let c=g.coordinates;while(Array.isArray(c[0]))c=c[0];return c;};
const ringOf=g=>{let c=g.coordinates;while(Array.isArray(c[0][0]))c=c[0];return c;};
const areaM2=r=>{let a=0;for(let i=0;i<r.length;i++){const [x1,y1]=r[i],[x2,y2]=r[(i+1)%r.length];a+=(x1*KX)*(y2*KY)-(x2*KX)*(y1*KY);}return Math.abs(a)/2;};
const EDGE_IDX=[0,4];   // only the north edges (0 = canal side, 4 = Gill Road side) hide small houses
const distEdgeM=pt=>{let best=1e9;for(let i=0;i<CAMPUS.length;i++){if(!EDGE_IDX.includes(i))continue;const a=CAMPUS[i],b=CAMPUS[(i+1)%CAMPUS.length];
  const px=pt[0]*KX,py=pt[1]*KY,ax=a[0]*KX,ay=a[1]*KY,dx=b[0]*KX-ax,dy=b[1]*KY-ay;
  let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));best=Math.min(best,Math.hypot(px-(ax+t*dx),py-(ay+t*dy)));}return best;};
const keep=f=>{const pt=firstPt(f.geometry);
  if(!inside(pt,CAMPUS)||EXCLUDE_ZONES.some(z=>inside(pt,z)))return false;
  return !(distEdgeM(pt)<EDGE_ZONE_M&&areaM2(ringOf(f.geometry))<SMALL_AREA_M2);};

const markers={};
function card(s){const [c]=TYPES[s.type];const ph=(s.photos||[]).map(k=>PHOTOS[k]);
  return `<div class="card">${ph[0]?`<img id="m_${s.id}" src="${ph[0]}">`:''}${ph.length>1?`<div class="th">${ph.map(p=>`<img src="${p}" onclick="document.getElementById('m_${s.id}').src=this.src">`).join('')}</div>`:''}
  <h3 style="margin:8px 0 2px">${s.name}</h3><span class="tag" style="background:${c}">${s.levels?s.levels+' floors':'campus'}</span>
  <p style="margin:6px 0 0;font-size:13px">${s.info}</p></div>`;}
SPOTS.forEach(s=>{const [c,ic]=TYPES[s.type];const el=document.createElement('div');el.className='pin'+(s.minor?' minor':'');
  el.innerHTML=`<i style="background:${c}">${ic}</i><span>${s.name}</span>`;
  const m=new maplibregl.Marker({element:el}).setLngLat(s.pos)
    .setPopup(new maplibregl.Popup({offset:32,maxWidth:'260px'}).setHTML(card(s))).addTo(map);
  m.on('dragend',()=>{s.pos=m.getLngLat().toArray();moved[s.id]=s.pos.map(v=>+v.toFixed(6));if(s.id==='iti')itiBuilding(s.pos);
    try{localStorage.setItem('gndec_pos',JSON.stringify(moved))}catch(e){};recolor();});
  markers[s.id]=m;});

const list=document.getElementById('list'),q=document.getElementById('q');
const menuBtn=document.getElementById('menu');
function setMenu(open){document.body.classList.toggle('pclosed',!open);menuBtn.textContent=open?'\u2715':'\u2630';}
menuBtn.onclick=()=>setMenu(document.body.classList.contains('pclosed'));
setMenu(!isMobile());   // phone: menu starts closed, tap the button to open
function go(s){if(isMobile())setMenu(false);map.flyTo({center:s.pos,zoom:18.6,pitch:62,duration:2000});const m=markers[s.id];if(!m.getPopup().isOpen())m.togglePopup();}
function renderList(f=''){list.innerHTML='';const q=f.toLowerCase();
  const items=[
    ...SPOTS.map(s=>({name:s.name,icon:TYPES[s.type][1],go:()=>go(s)})),
    ...Object.keys(BN).map(k=>({name:BN[k],icon:TYPES[bnType(BN[k])][1],
      go:()=>{if(isMobile())setMenu(false);map.flyTo({center:k.split(',').map(Number),zoom:18.6,pitch:62,duration:2000});}}))
  ].filter(i=>i.name.toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name,undefined,{sensitivity:'base',numeric:true}));
  items.forEach(i=>{const b=document.createElement('button');b.className='btn';b.textContent=i.icon+' '+i.name;b.onclick=i.go;list.appendChild(b);});}

q.oninput=()=>renderList(q.value);
q.onkeydown=e=>{if(e.key==='Enter'){const s=SPOTS.find(s=>s.name.toLowerCase().includes(q.value.toLowerCase()));if(s)go(s);else{const k=Object.keys(BN).find(k=>BN[k].toLowerCase().includes(q.value.toLowerCase()));if(k)map.flyTo({center:k.split(',').map(Number),zoom:18.6,pitch:62,duration:2000});}}};
document.getElementById('reset').onclick=()=>{if(isMobile())setMenu(false);map.flyTo({center:CENTER,zoom:HOMEZ,pitch:58,bearing:-20});};
document.getElementById('night').onclick=()=>{const n=document.getElementById('map').classList.toggle('night');document.body.classList.toggle('nu',n);};



// ---- click any building to name it ----
let BN=Object.assign({},BUILDING_NAMES);try{Object.assign(BN,JSON.parse(localStorage.getItem('gndec_bn')||'{}'))}catch(e){}
const bnM={};
const BN_TYPES=[[/pool|swim/i,'pool'],[/hostel/i,'hostel'],[/canteen|cafe|mess|juice|tea|food|bakery|shop/i,'food'],
  [/ground|sport|gym|court|stadium|field/i,'sports'],[/library/i,'lib'],[/audi|theat|hall|seminar/i,'culture'],
  [/gate|office|admin|bank|atm|principal|reception|guest|home/i,'admin'],[/lab|block|dept|department|college|poly|school|workshop|class|academic|centre|center/i,'edu']];
const bnType=n=>(BN_TYPES.find(t=>t[0].test(n))||[0,'misc'])[1];
function openBN(k,ll){new maplibregl.Popup({offset:22}).setLngLat(ll).setHTML(`<b>${BN[k]?'Rename building':'Name this building'}</b><br><input id="bni" value="${BN[k]||''}" style="width:150px"> <button onclick="saveBN('${k}')">Save</button>`).addTo(map);}
function bnShow(k){if(bnM[k]){bnM[k].remove();delete bnM[k];}if(!BN[k])return;
  const [c,ic]=TYPES[bnType(BN[k])],pos=k.split(',').map(Number),el=document.createElement('div');
  el.className='pin minor';el.innerHTML=`<i style="background:${c}">${ic}</i><span></span>`;el.lastChild.textContent=BN[k];
  el.onclick=()=>openBN(k,pos);
  const m=new maplibregl.Marker({element:el,draggable:false}).setLngLat(pos).addTo(map);bnM[k]=m;
  m.on('dragend',()=>{const p=m.getLngLat(),nk=p.lng.toFixed(5)+','+p.lat.toFixed(5),nm=BN[k];
    delete BN[k];BN[nk]=nm;try{localStorage.setItem('gndec_bn',JSON.stringify(BN))}catch(e){};bnShow(k);bnShow(nk);renderList(q.value);});}
function bnKey(c){const near=Object.keys(BN).find(k=>{const p=k.split(',').map(Number);return Math.hypot((p[0]-c[0])*KX,(p[1]-c[1])*KY)<15;});
  return near||c[0].toFixed(5)+','+c[1].toFixed(5);}
function saveBN(k){const v=document.getElementById('bni').value.trim();if(v)BN[k]=v;else delete BN[k];
  try{localStorage.setItem('gndec_bn',JSON.stringify(BN))}catch(e){};bnShow(k);renderList(q.value);
  document.querySelectorAll('.maplibregl-popup').forEach(p=>p.remove());}
Object.keys(BN).forEach(bnShow);
renderList(q.value);
document.getElementById('copybn').onclick=()=>{const t='const BUILDING_NAMES = '+JSON.stringify(BN)+';';
  navigator.clipboard.writeText(t).then(()=>alert('Copied! Paste it into BUILDING_NAMES in the file.'),()=>prompt('Copy this:',t));};

// ---- 3D campus ----
let CB=[],intro=false,ftries=0;
function recolor(){
  CB.forEach(f=>{const r=ringOf(f.geometry),[cx,cy]=cen(r);let col='#8fa8d6',best=15;
    SPOTS.forEach(s=>{const c=TYPES[s.type][0];if(inside(s.pos,r)){col=c;best=0;}else{const d=Math.hypot((cx-s.pos[0])*KX,(cy-s.pos[1])*KY);if(d<best){best=d;col=c;}}});
    f.properties.color=col;});
  const src=map.getSource('campus-buildings');if(src)src.setData({type:'FeatureCollection',features:CB});}
function findPOIs(){let miss=0;const poi=map.querySourceFeatures('openmaptiles',{sourceLayer:'poi'});
  SPOTS.filter(s=>s.find&&!s.fixed).forEach(s=>{const h=poi.find(f=>s.find.test((f.properties.name||'')+' '+(f.properties['name:latin']||'')));
    if(h){s.pos=[h.geometry.coordinates[0]+(s.foff?s.foff[0]:0),h.geometry.coordinates[1]+(s.foff?s.foff[1]:0)];markers[s.id].setLngLat(s.pos);s.fixed=true;}else miss++;});
  const cn=onGround(),ci=placeITI();
  recolor();if((miss||!cn||!ci)&&++ftries<20)setTimeout(findPOIs,1000);}
// places the ITI between the Workshops and the Open Air Theatre
function placeITI(){
  const w=SPOTS.find(x=>x.id==='work'),o=SPOTS.find(x=>x.id==='oat'),t=SPOTS.find(x=>x.id==='iti');
  if(t.fixed){if(!DYN.length)itiBuilding(t.pos);return true;}
  let c;
  if(w.fixed&&o.fixed){
    const vx=(o.pos[0]-w.pos[0])*KX,vy=(o.pos[1]-w.pos[1])*KY;     // workshops -> theatre (metres)
    c=[w.pos[0]+(0.555*vx+0.0896*vy)/KX,w.pos[1]+(0.555*vy-0.0896*vx)/KY];
  }else if(ftries>=15&&w.fixed)c=[w.pos[0]-0.00005,w.pos[1]+0.0011];
  else return false;
  itiBuilding(c);
  t.pos=c;markers.iti.setLngLat(c);t.fixed=true;return true;}
// the ITI building always sits exactly under its pin (moves when the pin moves)
function itiBuilding(c){const t=SPOTS.find(x=>x.id==='iti'),hx=0.00023,hy=0.0001;   // about 44 m x 22 m
  DYN.length=0;DYN.push({levels:t.levels,color:'#8fa8d6',corners:[[c[0]-hx,c[1]-hy],[c[0]+hx,c[1]-hy],[c[0]+hx,c[1]+hy],[c[0]-hx,c[1]+hy]]});
  const src=map.getSource('custom');if(src)src.setData(customFC());}
// places the canteen inside the ground (green area) near the workshops
function onGround(){
  const w=SPOTS.find(x=>x.id==='work'),c=SPOTS.find(x=>x.id==='canteen');
  if(c.fixed)return true;if(!w.fixed)return false;
  let best=null,bd=1e9;
  ['landuse','landcover','park'].forEach(L=>{let fs=[];try{fs=map.querySourceFeatures('openmaptiles',{sourceLayer:L})}catch(e){}
    fs.forEach(f=>{if(!/Polygon/.test(f.geometry.type))return;
      if(!/pitch|grass|park|playground|recreation|stadium|sport/i.test((f.properties.class||'')+' '+(f.properties.subclass||'')))return;
      const r=ringOf(f.geometry);if(areaM2(r)<2500)return;
      r.forEach(p=>{const d=Math.hypot((p[0]-w.pos[0])*KX,(p[1]-w.pos[1])*KY);if(d<bd){bd=d;best={r,p};}});});});
  if(best&&bd<150){const [cx,cy]=cen(best.r),d=Math.hypot((cx-best.p[0])*KX,(cy-best.p[1])*KY)||1,k=12/d;
    c.pos=[best.p[0]+(cx-best.p[0])*k,best.p[1]+(cy-best.p[1])*k];
    // shift ~85 m west/south inside the ground, where the canteen is
    for(const f of [1,.7,.5,.3]){const t=[c.pos[0]-0.00081*f,c.pos[1]-0.00034*f];if(inside(t,best.r)){c.pos=t;break;}}}
  else if(ftries>=15)c.pos=[w.pos[0]-0.00006,w.pos[1]-0.00012];
  else return false;
  markers.canteen.setLngLat(c.pos);c.fixed=true;return true;}
map.once('style.load',()=>{
  // hides OSM POI icons/labels (shops, cafes, ATMs...). Set to true to show them again.
  const SHOW_OSM_POI=false;
  if(!SHOW_OSM_POI)map.getStyle().layers.forEach(l=>{if(l['source-layer']==='poi'||l['source-layer']==='housenumber')map.setLayoutProperty(l.id,'visibility','none');});
  if(map.getLayer('building-3d'))map.setLayoutProperty('building-3d','visibility','none');
  const world=[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]];
  map.addSource('mask',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[world,[...CAMPUS,CAMPUS[0]].reverse()]}}});
  map.addLayer({id:'mask',type:'fill',source:'mask',paint:{'fill-color':'#eef1f6','fill-opacity':0.96}});
  map.addSource('outline',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[...CAMPUS,CAMPUS[0]]}}});
  map.addLayer({id:'outline',type:'line',source:'outline',paint:{'line-color':'#1a4fa0','line-width':3}});
  map.addSource('campus-buildings',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'campus-buildings-3d',type:'fill-extrusion',source:'campus-buildings',paint:{
    'fill-extrusion-color':['coalesce',['get','color'],'#8fa8d6'],'fill-extrusion-height':['coalesce',['get','render_height'],10],
    'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.95}});
  map.on('click','campus-buildings-3d',e=>{
    if(e.originalEvent.target.closest('.pin'))return;
    const k=bnKey(cen(ringOf(e.features[0].geometry)));
    openBN(k,e.lngLat);});
  map.addSource('custom',{type:'geojson',data:customFC()});
  map.addLayer({id:'custom-3d',type:'fill-extrusion',source:'custom',paint:{'fill-extrusion-color':['get','color'],'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':0.95}});
  let tries=0;
  const build=()=>{const seen=new Set();CB=[];
    map.querySourceFeatures('openmaptiles',{sourceLayer:'building'}).forEach(f=>{const k=JSON.stringify(f.geometry.coordinates);
      if(!seen.has(k)&&keep(f)){seen.add(k);CB.push({type:'Feature',properties:Object.assign({},f.properties),geometry:f.geometry});}});
    SPOTS.filter(x=>x.snap&&!x.fixed).forEach(x=>{let best=null,ba=0;CB.forEach(f=>{const r=ringOf(f.geometry),c=cen(r);
      if(Math.hypot((c[0]-x.pos[0])*KX,(c[1]-x.pos[1])*KY)<60){const ar=areaM2(r);if(ar>ba){ba=ar;best=c;}}});
      if(best){x.pos=best;markers[x.id].setLngLat(best);x.fixed=true;}});
    recolor();
    if(CB.length<5){if(++tries<40){setTimeout(build,800);}else showSt(location.protocol==='http:'||location.protocol==='https:'?'Could not load the 3D buildings. Check your internet connection and reload.':'Map data cannot load when this file is opened directly from phone storage. Open it from a website link instead (e.g. Netlify Drop or GitHub Pages).');return;}
    st.style.display='none';
    if(!intro){intro=true;map.easeTo({zoom:HOMEZ,pitch:58,bearing:-20,duration:5000});}
    setTimeout(findPOIs,1000);};
  setTimeout(build,1000);

});
</script></body></html>
